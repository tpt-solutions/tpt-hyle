[package]
name = "tpt-rift-wasm"
description = "WebAssembly bindings for tpt-hyle-rift (IndexedDB backing store)"
readme = "README.md"
keywords = ["wasm", "indexeddb", "offline-first", "sync", "tpt-rift"]
categories = ["wasm", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-hyle-rift = { workspace = true }
wasm-bindgen = "0.2"
web-sys = "0.3"
