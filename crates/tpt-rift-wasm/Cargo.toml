[package]
name = "tpt-rift-wasm"
description = "WebAssembly bindings for tpt-rift: an in-memory replica that syncs by passing bytes"
readme = "README.md"
keywords = ["wasm", "offline-first", "sync", "crdt", "tpt-rift"]
categories = ["wasm", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-hyle = { workspace = true, features = ["alloc"] }
tpt-rift = { workspace = true }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
