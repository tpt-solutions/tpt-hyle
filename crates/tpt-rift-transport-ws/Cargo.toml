[package]
name = "tpt-rift-transport-ws"
description = "WebSocket transport for tpt-rift"
readme = "README.md"
keywords = ["websocket", "sync", "transport", "offline-first", "tpt-rift"]
categories = ["network-programming", "web-programming::websocket"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tpt-rift = { workspace = true }
