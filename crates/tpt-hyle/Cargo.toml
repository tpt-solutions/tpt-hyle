[package]
name = "tpt-hyle"
description = "Sync-native, append-only micro key-value store (State + Sync segments)"
readme = "README.md"
keywords = ["database", "offline-first", "crdt", "no-std", "storage"]
categories = ["database-implementations", "no-std", "embedded"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
json = ["alloc", "dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
