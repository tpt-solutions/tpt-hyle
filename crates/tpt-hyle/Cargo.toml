[package]
name = "tpt-hyle"
description = "Sync-native, encrypted, append-only micro key-value store"
readme = "README.md"
keywords = ["database", "offline-first", "crdt", "encryption", "storage"]
categories = ["database-implementations", "no-std", "embedded"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["std"]
# The store needs a heap for encryption and batches. The bare no_std build
# keeps the storage trait, the record formats, and the error type only.
alloc = ["dep:chacha20poly1305", "dep:sha2"]
std = ["alloc", "dep:argon2", "dep:getrandom"]
json = ["alloc", "dep:serde", "dep:serde_json"]

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "0.2", optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
