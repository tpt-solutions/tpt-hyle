[package]
name = "tpt-rift-transport-webrtc"
description = "WebRTC peer-to-peer transport for tpt-rift"
readme = "README.md"
keywords = ["webrtc", "p2p", "sync", "offline-first", "tpt-rift"]
categories = ["network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tpt-rift = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
webrtc = "0.11"
bytes = "1"

[dev-dependencies]
tpt-hyle = { workspace = true, features = ["std"] }
