[workspace]
resolver = "2"
members = [
    "crates/tpt-hyle",
    "crates/tpt-rift",
    "crates/tpt-hyle-rift",
    "crates/tpt-rift-server",
    "crates/tpt-hyle-cli",
    "crates/tpt-rift-wasm",
    "crates/tpt-rift-transport-ws",
    "crates/tpt-rift-transport-webrtc",
    "crates/tpt-hyle-test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-hyle"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
sha2 = { version = "0.10", default-features = false }
rand = "0.8"
proptest = "1.0"

# Internal crates
tpt-hyle = { path = "crates/tpt-hyle", version = "0.1.0", default-features = false }
tpt-rift = { path = "crates/tpt-rift", version = "0.1.0" }
tpt-hyle-rift = { path = "crates/tpt-hyle-rift", version = "0.1.0" }
